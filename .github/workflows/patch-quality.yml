) {\n            return false;\n        }\n        arsort( $buckets );\n        $dominant = (int) reset( $buckets );\n\n        return count( $buckets ) < 6 || ( $dominant / $samples ) > 0.92;\n    }\n\n    private function is_generated_card( int $attachment_id ): bool {\"\"\"),\n])\n\nm='onkupon-autonomous-commerce-agent.php'\nh=open(m,encoding='utf-8').read()\nopen(m,'w',encoding='utf-8').write(h.replace('0.7.4','0.8.0'))\nprint('ok')\nPYEOF\ngit config user.name actions-user\ngit config user.email actions@github.com\ngit add -A\ngit commit -m 'feat: quality audit agent; reject bot-challenge screenshots'\ngit push"}]}}}
