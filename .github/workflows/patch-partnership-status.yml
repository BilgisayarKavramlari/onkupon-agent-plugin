{
  "name": "patch-partnership-status",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "write"
  },
  "jobs": {
    "patch": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Apply patch",
          "run": "set -euo pipefail\npython3 - <<'PYEOF'\nimport io\n\ndef sub(path, pairs):\n    s = io.open(path, encoding='utf-8').read()\n    for a, b in pairs:\n        n = s.count(a)\n        assert n == 1, (path, a[:70], n)\n        s = s.replace(a, b)\n    io.open(path, 'w', encoding='utf-8').write(s)\n\nNEW_METHOD = r\"\"\"    /**\n     * Bir ortakligin urun olarak yayimlanabilir olup olmadigina karar verir.\n     *\n     * Onceki surum yalnizca tam eslesen bir kara liste kullaniyordu; bu yuzden\n     * PartnerStack'in \"application_declined\", \"application_pending\" ve\n     * \"program_ended\" gibi bilesik durum kodlari taninmadi ve sozlesmesi bitmis\n     * programlarin baglantilari sitede yayinda kaldi. Karar artik uc asamalidir:\n     *\n     * 1. Durum metni olumsuz bir belirtec iceriyorsa yayimlanmaz.\n     * 2. Durum bossa ya da olumlu bir belirtec iceriyorsa yayimlanir.\n     * 3. Taninmayan her durum yayimlanmaz.\n     *\n     * Ucuncu kural bilincli olarak temkinlidir: taninmayan bir durumda urunu\n     * gizlemek, gecersiz bir ortaklik baglantisini ziyaretciye gostermekten\n     * daha az maliyetlidir.\n     */\n    private function is_publishable( string $status, array $item ): bool {\n        if ( ! empty( $item['archived'] ) || ! empty( $item['is_archived'] ) ) {\n            return false;\n        }\n\n        $flat = trim( str_replace( array( '_', '-' ), ' ', $status ) );\n\n        $blocking = array(\n            'declin', 'reject', 'denied', 'refus', 'ended', 'cancel', 'suspend',\n            'paus', 'expir', 'terminat', 'archiv', 'revok', 'closed', 'churn',\n            'deactiv', 'inactive', 'disabl', 'hold', 'pending', 'applied',\n            'awaiting', 'invit', 'withdraw', 'removed', 'blocked', 'banned',\n        );\n        foreach ( $blocking as $token ) {\n            if ( false !== strpos( $flat, $token ) ) {\n                return false;\n            }\n        }\n\n        if ( '' === $flat ) {\n            return true;\n        }\n\n        $allowed = array( 'active', 'approved', 'accepted', 'live', 'joined', 'enabled', 'enrolled', 'connected' );\n        foreach ( $allowed as $token ) {\n            if ( false !== strpos( $flat, $token ) ) {\n                return true;\n            }\n        }\n\n        return false;\n    }\n\n    private function referral_url( array $item, array $company ): string {\"\"\"\n\nOLD_STATUS = r\"\"\"        $inactive = in_array( $status, [ 'archived', 'inactive', 'disabled', 'rejected', 'declined', 'canceled', 'cancelled', 'suspended', 'paused', 'on_hold', 'on hold', 'terminated', 'ended', 'expired', 'revoked', 'closed', 'churned', 'deactivated' ], true );\n        $active = empty( $item['archived'] ) && empty( $item['is_archived'] ) && ! $inactive;\"\"\"\n\nsub('includes/Affiliate/PartnershipNormalizer.php', [\n    (OLD_STATUS, r\"\"\"        $active = $this->is_publishable( $status, $item );\"\"\"),\n    (r\"\"\"    private function referral_url( array $item, array $company ): string {\"\"\", NEW_METHOD),\n])\n\nsub('includes/Affiliate/AffiliateProductLifecycleManager.php', [\n    (r\"\"\"            if ( is_array( $program ) ) {\n                delete_post_meta( $product_id, '_onkupon_partnerstack_missing_count' );\"\"\",\n     r\"\"\"            if ( is_array( $program ) ) {\n                delete_post_meta( $product_id, '_onkupon_partnerstack_missing_count' );\n                update_post_meta( $product_id, '_onkupon_partnerstack_status', sanitize_text_field( (string) ( $program['status'] ?? '' ) ) );\"\"\"),\n    (r\"\"\"            $missing_count = 1 + absint( get_post_meta( $product_id, '_onkupon_partnerstack_missing_count', true ) );\"\"\",\n     r\"\"\"            update_post_meta( $product_id, '_onkupon_partnerstack_status', 'missing_from_snapshot' );\n            $missing_count = 1 + absint( get_post_meta( $product_id, '_onkupon_partnerstack_missing_count', true ) );\"\"\"),\n])\n\nsub('includes/Admin/AffiliateProgramsPage.php', [\n    (r\"\"\"                '0' === (string) get_post_meta( $post->ID, '_onkupon_affiliate_active', true ) ? 'inactive / hidden' : 'active',\n                '<a href=\"' . $destination . '\" rel=\"noreferrer noopener\">'\"\"\",\n     r\"\"\"                '0' === (string) get_post_meta( $post->ID, '_onkupon_affiliate_active', true ) ? 'inactive / hidden' : 'active',\n                esc_html( (string) get_post_meta( $post->ID, '_onkupon_partnerstack_status', true ) ?: '-' ),\n                '<a href=\"' . $destination . '\" rel=\"noreferrer noopener\">'\"\"\"),\n    (r\"\"\"[ 'Product', 'Status', 'Agreement', 'Destination host', 'Page', 'Last synced' ]\"\"\",\n     r\"\"\"[ 'Product', 'Status', 'Agreement', 'PartnerStack durumu', 'Destination host', 'Page', 'Last synced' ]\"\"\"),\n])\n\nsub('onkupon-autonomous-commerce-agent.php', [\n    (r\"\"\" * Version: 0.9.1\"\"\", r\"\"\" * Version: 0.9.2\"\"\"),\n    (r\"\"\"define( 'ONKUPON_AGENT_VERSION', '0.9.1' );\"\"\", r\"\"\"define( 'ONKUPON_AGENT_VERSION', '0.9.2' );\"\"\"),\n])\n\nprint('patched ok')\nPYEOF\nfor f in includes/Affiliate/PartnershipNormalizer.php includes/Affiliate/AffiliateProductLifecycleManager.php includes/Admin/AffiliateProgramsPage.php onkupon-autonomous-commerce-agent.php; do php -l \"$f\"; done\ngit config user.name 'actions-user'\ngit config user.email 'actions@github.com'\ngit add -A\ngit commit -m 'fix: recognise PartnerStack compound statuses (declined/pending/ended) and surface them'\ngit push\n"
        }
      ]
    }
  }
}
