ublic static function is_placeholder( int $attachment_id ): bool {\n        $asset = (string) get_post_meta( $attachment_id, '_onkupon_agent_generated_asset', true );\n        if ( 'affiliate_card' === $asset ) {\n            return true;\n        }\n        if ( 'affiliate_screenshot' === $asset ) {\n            $path = get_attached_file( $attachment_id );\n            return $path && file_exists( $path ) && self::looks_blank( $path );\n        }\n        return false;\n    }\n\n    /**\n     * Kart uzerine basilacak logo adresi: once PartnerStack'in verdigi logo,\n     * yoksa alan adina dayali favicon servisi.\n     */\n    private function logo_candidate( string $destination, array $program ): string {\n        $logo = esc_url_raw( (string) ( $program['logo_url'] ?? '' ) );\n        if ( '' !== $logo ) {\n            return $logo;\n        }\n        $host = (string) wp_parse_url( $destination, PHP_URL_HOST );\n        if ( '' === $host ) {\n            return '';\n        }\n        return 'https://www.google.com/s2/favicons?domain=' . rawurlencode( $host ) . '&sz=256';\n    }\"\"\"),\n])\n\nsub('includes/Affiliate/AffiliateEnrichmentService.php', [\n (r\"\"\"            $needs_image = ! $image_id || 'affiliate_card' === (string) get_post_meta( $image_id, '_onkupon_agent_generated_asset', true );\"\"\",\n  r\"\"\"            $needs_image = ! $image_id || AffiliateImageResolver::is_placeholder( $image_id );\"\"\"),\n])\n\nsub('includes/Quality/QualityAuditService.php', [\n (r\"\"\"            } elseif ( 'affiliate_screenshot' === $asset ) {\n                $path = get_attached_file( $image_id );\n                if ( $path && file_exists( $path ) && AffiliateImageResolver::looks_blank( $path ) ) {\n                    $issues[] = 'image_challenge_shot';\n                }\n            }\"\"\",\n  r\"\"\"            } elseif ( 'affiliate_screenshot' === $asset && AffiliateImageResolver::is_placeholder( $image_id ) ) {\n                $issues[] = 'image_challeng