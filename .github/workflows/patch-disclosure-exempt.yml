{"name":"patch-disclosure-exempt","on":{"workflow_dispatch":{}},"permissions":{"contents":"write"},"jobs":{"patch":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"name":"apply","run":"python3 - <<'PYEOF'\ndef sub(path, pairs):\n    s=open(path,encoding='utf-8').read()\n    for a,b in pairs:\n        assert s.count(a)==1, (path, a[:60])\n        s=s.replace(a,b)\n    open(path,'w',encoding='utf-8').write(s)\n\nsub('includes/Affiliate/AffiliateContentComposer.php', [\n (r\"\"\"    public static function is_confidential( string $sentence ): bool {\n        foreach ( self::CONFIDENTIAL_PATTERNS as $pattern ) {\"\"\",\n  r\"\"\"    public static function is_confidential( string $sentence ): bool {\n        // Kendi is ortakligi bildirimimiz \"komisyon\" kelimesini icerir ve\n        // suzgece takilir. Bu cumle gizli bir sart degil, aksine kamuya acik\n        // olmasi gereken bildirimin ta kendisidir; muaf tutulur.\n        $normalized = trim( wp_strip_all_tags( $sentence ) );\n        if ( '' !== $normalized && false !== mb_strpos( self::DISCLOSURE, $normalized ) ) {\n            return false;\n        }\n\n        foreach ( self::CONFIDENTIAL_PATTERNS as $pattern ) {\"\"\"),\n])\n\nm='onkupon-autonomous-commerce-agent.php'\nh=open(m,encoding='utf-8').read()\nopen(m,'w',encoding='utf-8').write(h.replace('0.8.0','0.8.1'))\nprint('ok')\nPYEOF\ngit config user.name actions-user\ngit config user.email actions@github.com\ngit add -A\ngit commit -m 'fix: exempt our own disclosure from the confidential-terms filter'\ngit push"}]}}}
