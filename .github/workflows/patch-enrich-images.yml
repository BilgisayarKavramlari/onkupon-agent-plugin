{"name":"patch-enrich-images","on":{"workflow_dispatch":{}},"permissions":{"contents":"write"},"jobs":{"patch":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"name":"apply","run":"python3 - <<'PYEOF'\ndef sub(path, pairs):\n    s=open(path,encoding='utf-8').read()\n    for a,b in pairs:\n        assert s.count(a)==1, (path, a[:50])\n        s=s.replace(a,b)\n    open(path,'w',encoding='utf-8').write(s)\n\nsub('includes/Affiliate/AffiliateEnrichmentService.php', [\n (r\"\"\"            try {\n                $composed = $composer->compose( $program, $program['referral_url'] );\n                if ( $composed ) {\"\"\",\n  r\"\"\"            try {\n                $needs_text = '' === (string) get_post_meta( $product_id, AffiliateContentComposer::META_CONTENT_HASH, true )\n                    && $composer->needs_content( $product, $program );\n                $composed = $needs_text ? $composer->compose( $program, $program['referral_url'] ) : [];\n                if ( $composed ) {\"\"\"),\n (r\"\"\"                    ++$summary['enriched'];\n                    $summary['product_ids'][] = $product_id;\n                } else {\n                    ++$summary['failed'];\n                }\"\"\",\n  r\"\"\"                    ++$summary['enriched'];\n                    $summary['product_ids'][] = $product_id;\n                } elseif ( $needs_text ) {\n                    ++$summary['failed'];\n                }\"\"\"),\n (r\"\"\"                $resolver->ensure( $product_id, $program );\"\"\",\n  r\"\"\"                // Bu servis zaten yalnizca eksik urunleri ele aliyor; gorsel\n                // icin 12 saatlik bekleme penceresi burada gecerli degil.\n                delete_post_meta( $product_id, AffiliateImageResolver::META_CHECKED );\n                $resolver->ensure( $product_id, $program );\"\"\"),\n (r\"\"\"            if ( (string) get_post_meta( $product_id, AffiliateContentComposer::META_CONTENT_HASH, true ) !== '' ) {\n         