{"name":"patch-disclosure","on":{"workflow_dispatch":{}},"permissions":{"contents":"write"},"jobs":{"patch":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"name":"apply","run":"python3 - <<'PYEOF'\ndef sub(path, pairs):\n    s=open(path,encoding='utf-8').read()\n    for a,b in pairs:\n        assert s.count(a)==1, (path, a[:50])\n        s=s.replace(a,b)\n    open(path,'w',encoding='utf-8').write(s)\n\nsub('includes/Affiliate/AffiliateContentComposer.php', [\n (r\"\"\"        if ( '' !== $audience ) {\n            $html .= '<p>Kimler için uygun?</p>' . \"\\n\";\n            $html .= '<p>' . esc_html( $audience ) . '</p>' . \"\\n\";\n        }\n        $html .= '<p>' . esc_html( self::DISCLOSURE ) . '</p>';\"\"\",\n  r\"\"\"        if ( '' !== $audience ) {\n            $html .= '<p>Kimler için uygun?</p>' . \"\\n\";\n            $html .= '<p>' . esc_html( $audience ) . '</p>';\n        }\n\n        // Is ortakligi bildirimi artik aciklama govdesine yazilmaz; urun\n        // sayfasinda baglantinin altinda ayri bir not olarak gosterilir.\n        $html = trim( $html );\"\"\"),\n (r\"\"\"    public static function contains_confidential( string $text ): bool {\"\"\",\n  r\"\"\"    /**\n     * Eski surumlerin aciklama govdesine yazdigi is ortakligi bildirimini\n     * temizler. Bildirim kaldirilmaz, yalnizca yerini degistirir.\n     */\n    public static function strip_disclosure( string $html ): string {\n        $needles = [\n            '<p>' . esc_html( self::DISCLOSURE ) . '</p>',\n            '<p>' . self::DISCLOSURE . '</p>',\n            self::DISCLOSURE,\n        ];\n        foreach ( $needles as $needle ) {\n            $html = str_replace( $needle, '', $html );\n        }\n        return trim( preg_replace( '/(\\R\\s*){3,}/u', \"\\n\\n\", $html ) ?: $html );\n    }\n\n    public static function contains_confidential( string $text ): bool {\"\"\"),\n])\n\nsub('includes/Affiliate/AffiliateProductImporter.php', [\n (r\"\"\"        $product->set_product_url( $referral_url );\n        $product->set_button_text(\"\"\",\n  r\"\"\"        // Eski surumlerin govdeye yazdigi bildirim her senkronda temizlenir.\n        $product->set_description( AffiliateContentComposer::strip_disclosure( (string) $product->get_description() ) );\n        $product->set_short_description( AffiliateContentComposer::strip_disclosure( (string) $product->get_short_description() ) );\n\n        $product->set_product_url( $referral_url );\n        $product->set_button_text(\"\"\"),\n])\n\nsub('includes/Plugin.php', [\n (r\"\"\"        ( new AffiliateClickTracker() )->register();\"\"\",\n  r\"\"\"        ( new AffiliateClickTracker() )->register();\n        ( new \\OnKupon\\Agent\\Affiliate\\AffiliateDisclosureNotice() )->register();\"\"\"),\n])\n\nm='onkupon-autonomous-commerce-agent.php'\nh=open(m,encoding='utf-8').read()\nopen(m,'w',encoding='utf-8').write(h.replace('0.7.3','0.7.4'))\nprint('ok')\nPYEOF\ngit config user.name actions-user\ngit config user.email actions@github.com\ngit add -A\ngit commit -m 'refactor: move affiliate disclosure out of the description body'\ngit push"}]}}}
