{"name":"patch-suspend-sitemap","on":{"workflow_dispatch":{}},"permissions":{"contents":"write"},"jobs":{"patch":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"name":"apply","run":"python3 - <<'PYEOF'\np='includes/Affiliate/PartnershipNormalizer.php'\ns=open(p,encoding='utf-8').read()\nold=\"[ 'archived', 'inactive', 'disabled', 'rejected', 'declined', 'canceled', 'cancelled' ]\"\nnew=\"[ 'archived', 'inactive', 'disabled', 'rejected', 'declined', 'canceled', 'cancelled', 'suspended', 'paused', 'on_hold', 'on hold', 'terminated', 'ended', 'expired', 'revoked', 'closed', 'churned', 'deactivated' ]\"\nassert old in s\nopen(p,'w',encoding='utf-8').write(s.replace(old,new))\nq='includes/SEO/SitemapAuditor.php'\nt=open(q,encoding='utf-8').read()\no=\"            static fn( $loc ): string => esc_url_raw( html_entity_decode( trim( (string) $loc ) ) ),\"\nn=\"            static function ( $loc ): string {\\n                $loc = trim( (string) $loc );\\n                if ( 0 === strpos( $loc, '<![CDATA[' ) ) {\\n                    $loc = trim( substr( $loc, 9, -3 ) );\\n                }\\n                return esc_url_raw( html_entity_decode( $loc ) );\\n            },\"\nassert o in t\nopen(q,'w',encoding='utf-8').write(t.replace(o,n))\nm='onkupon-autonomous-commerce-agent.php'\nh=open(m,encoding='utf-8').read()\nopen(m,'w',encoding='utf-8').write(h.replace('0.6.0','0.6.1'))\nPYEOF\ngit config user.name actions-user\ngit config user.email actions@github.com\ngit add -A\ngit commit -m 'fix: suspended partnerships and CDATA sitemap loc'\ngit push"}]}}}
